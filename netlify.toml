[build]
# Must be `npm run build`, NOT `npx next build`.
#
# The sitemap is generated by the `postbuild` script in package.json, and npm
# only fires pre/post lifecycle scripts when a script is invoked via `npm run`.
# Calling the `next` binary directly skips `postbuild` entirely, so next-sitemap
# never runs and Netlify deploys whatever sitemap happens to be committed in
# public/ — silently going stale every time a route is added.
command = "npm run build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"